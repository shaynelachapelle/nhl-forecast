name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nhl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nhl_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: scripts/apply_migrations_plain_postgres.sh "$TEST_DATABASE_URL"
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nhl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/nhl_test
      # The build prerenders pages, so it reads an empty database as the website role.
      DATABASE_URL: postgresql://web_reader:ci@localhost:5432/nhl_test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/apply_migrations_plain_postgres.sh "$ADMIN_URL"
        working-directory: .
      - run: psql "$ADMIN_URL" -c "alter role web_reader password 'ci'"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
