name: daily

on:
  schedule:
    # UTC. GitHub starts scheduled runs late, so these
    # avoid :00 and repeat; a rerun with nothing new writes nothing.
    - cron: "17 9 * * *"
    - cron: "17 13 * * *"
    - cron: "47 15 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - run: uv run nhl-forecast daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
